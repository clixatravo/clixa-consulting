<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="clixaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="clixaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with sleek dark bevel -->
  <rect width="64" height="64" rx="16" fill="#030712" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1E293B" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#clixaGrad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Modern Stylized CLIXA "C" & Forward Growth Chevron -->
  <!-- Outer C Arc -->
  <path d="M44 19C40.5 15.5 35.5 14 30 14C19.5 14 13 22 13 32C13 42 19.5 50 30 50C35.5 50 40.5 48.5 44 45" 
        stroke="url(#clixaGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" />

  <!-- Inner Dynamic Acceleration Arrow -->
  <path d="M28 24L36 32L28 40" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Innovation Node Dot -->
  <circle cx="45" cy="32" r="3.5" fill="#38BDF8" filter="url(#glow)" />
</svg>
