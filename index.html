    <!-- Donnees structurees : FAQ (eligible aux rich results Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Combien de temps prend generalement une implementation d'ERP Odoo ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Selon la taille de votre entreprise et le perimetre retenu (3 a 8 modules), un deploiement standard dure entre 2 et 4 mois. Notre methodologie iterative en 4 phases permet de mettre en production de premieres briques fonctionnelles des les premieres semaines." }
        },
        {
          "@type": "Question",
          "name": "En quoi consiste l'intervention de CLIXA en Assistance a Maitrise d'Ouvrage (AMOA) ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nous agissons en tiers de confiance independant aux cotes de votre Direction Generale : traduction des besoins metiers en exigences techniques, redaction du cahier des charges, selection et coordination des integrateurs, tests de recette fonctionnelle." }
        },
        {
          "@type": "Question",
          "name": "Vos consultants interviennent-ils sur site au Maroc et en France ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Oui. Avec nos bureaux a Casablanca et a Paris, nous combinons presence physique pour les etapes cles (ateliers de cadrage, formations, comites de pilotage) et suivi operationnel agile." }
        },
        {
          "@type": "Question",
          "name": "Comment garantissez-vous que nos equipes adopteront le nouvel outil ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nous impliquons vos collaborateurs des le diagnostic initial, adaptons l'ergonomie a leurs habitudes de travail, redigeons des modes operatoires simplifies et assurons un accompagnement post-demarrage jusqu'a l'autonomie totale." }
        },
        {
          "@type": "Question",
          "name": "Comment sont facturees vos prestations de conseil et d'integration ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nous privilegions des engagements au forfait avec livrables contractuels garantis. Avant toute mission, un echange de cadrage gratuit permet d'etablir un devis detaille et une feuille de route realiste." }
        }
      ]
    }
    </script>
