<!doctype html>
<html lang="fr" class="sm:scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Le SVG seul ne suffit pas : Google (résultats de recherche), Safari et
         iOS demandent un .ico ou un PNG. Sans eux, /favicon.ico tombait sur la
         réécriture SPA et renvoyait index.html : un globe à la place du logo. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLIXA Consulting | Conseil, Transformation & Performance</title>
    <meta name="description" content="CLIXA Consulting accompagne les dirigeants et leurs équipes dans leurs projets de transformation, de digitalisation et d'amélioration de la performance. Finance, Process, AMOA, ERP Odoo." />
    
    <meta name="theme-color" content="#020617" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="%ROBOTS%" />

    <!-- Security Headers & Privacy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="CLIXA Consulting | Conseil, Transformation & Performance" />
    <meta property="og:description" content="Accompagnement des dirigeants dans leurs projets de transformation, digitalisation, ERP Odoo, AMOA et performance opérationnelle." />
    <meta property="og:image" content="%SITE_URL%/images/erp-odoo.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta name="twitter:title" content="CLIXA Consulting | Conseil, Transformation & Performance" />
    <meta name="twitter:description" content="Accompagnement des dirigeants : ERP Odoo, Digitalisation, AMOA et Performance." />
    <meta name="twitter:image" content="%SITE_URL%/images/erp-odoo.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Polices variables : une plage de graisses (400..700 / 600..800) fait
      servir par Google UN seul fichier par famille, au lieu des 7 fichiers
      que demandait la liste explicite.

      La feuille est également sortie du chemin critique : en rel="stylesheet"
      classique, le premier rendu attendait un aller-retour réseau vers
      fonts.googleapis.com. media="print" la déclasse, onload la réactive.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap"
      media="print"
      onload="this.media='all';this.onload=null;"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap" /></noscript>

    <!-- Schema.org Structured Data (Google Rich Snippets SEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%SITE_URL%/#organization",
          "name": "CLIXA Consulting",
          "url": "%SITE_URL%/",
          "logo": "%SITE_URL%/icon-512.png",
          "description": "Cabinet de conseil en management, organisation, AMOA et intégration d'ERP Odoo au Maroc et en France.",
          "telephone": ["+212661344054", "+33753970186"],
          "email": "contact@clixaconseil.com",
          "address": [
            {
              "@type": "PostalAddress",
              "addressLocality": "Casablanca",
              "addressCountry": "MA"
            },
            {
              "@type": "PostalAddress",
              "addressLocality": "Paris",
              "addressCountry": "FR"
            }
          ],
          "areaServed": ["MA", "FR", "International"]
        },
        {
          "@type": "ProfessionalService",
          "name": "CLIXA Consulting - Conseil & ERP Odoo",
          "image": "%SITE_URL%/images/erp-odoo.webp",
          "url": "%SITE_URL%/",
          "telephone": "+212661344054",
          "priceRange": "$$$",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Casablanca",
            "addressCountry": "MA"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
